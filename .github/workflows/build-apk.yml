name: Build APK

on:
  workflow_dispatch:
    inputs:

      app_name:
        description: "Название приложения"
        required: true
        type: string
        default: "Salomat App"

      package_name:
        description: "Package name"
        required: true
        type: string
        default: "com.salomat.app.salomat"

      icon_path:
        description: "Путь к иконке"
        required: true
        type: string
        default: ".salomat/icon.png"

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Проверить package name
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |

          if [[ ! "$PACKAGE_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_]*(\.[a-zA-Z_][a-zA-Z0-9_]*)+$ ]]; then
            echo "Неверный package name"
            exit 1
          fi

          if [[ ! "$PACKAGE_NAME" == *.salomat ]]; then
            echo "Package name должен заканчиваться на .salomat"
            exit 1
          fi

      - name: Проверить index.html
        run: |

          if [ ! -f "index.html" ]; then
            echo "В корне репозитория отсутствует index.html"
            exit 1
          fi

      - name: Проверить иконку
        env:
          ICON_PATH: ${{ inputs.icon_path }}
        run: |

          if [ ! -f "$ICON_PATH" ]; then
            echo "Иконка не найдена: $ICON_PATH"
            exit 1
          fi

      - name: Создать Android проект
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ICON_PATH: ${{ inputs.icon_path }}
        run: |

          mkdir -p app/src/main/java
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp index.html app/src/main/assets/index.html

          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          mkdir -p "app/src/main/java/$PACKAGE_PATH"

          cp "$ICON_PATH" app-icon-source.png

          if command -v magick >/dev/null 2>&1; then
            MAGICK="magick"
          elif command -v convert >/dev/null 2>&1; then
            MAGICK="convert"
          else
            echo "ImageMagick не найден"
            exit 1
          fi

          $MAGICK app-icon-source.png \
            -resize 48x48 \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          $MAGICK app-icon-source.png \
            -resize 72x72 \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          $MAGICK app-icon-source.png \
            -resize 96x96 \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          $MAGICK app-icon-source.png \
            -resize 144x144 \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          $MAGICK app-icon-source.png \
            -resize 192x192 \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SalomatBuilder"

include(":app")
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
EOF

          cat > app/build.gradle <<EOF
plugins {
    id 'com.android.application'
}

android {
    namespace "$PACKAGE_NAME"

    compileSdk 35

    defaultConfig {
        applicationId "$PACKAGE_NAME"

        minSdk 23

        targetSdk 35

        versionCode 1

        versionName "1.0"
    }
}
EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <style
        name="AppTheme"
        parent="@android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:windowActionModeOverlay">true</item>

        <item name="android:colorAccent">#1769FF</item>

        <item name="android:navigationBarColor">#FFFFFF</item>

        <item name="android:statusBarColor">#FFFFFF</item>

        <item name="android:windowLightStatusBar">true</item>

    </style>

</resources>
EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
<?xml version="1.0" encoding="utf-8"?>

<manifest
    xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission
        android:name="android.permission.INTERNET" />

    <application
        android:allowBackup="true"
        android:usesCleartextTraffic="true"
        android:theme="@style/AppTheme"
        android:label="$APP_NAME"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>

                <action
                    android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          cat > "app/src/main/java/$PACKAGE_PATH/MainActivity.java" <<EOF
package $PACKAGE_NAME;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebResourceRequest;
import android.content.Intent;
import android.net.Uri;

public class MainActivity extends Activity {

    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        setContentView(webView);

        WebSettings settings = webView.getSettings();

        settings.setJavaScriptEnabled(true);

        settings.setDomStorageEnabled(true);

        settings.setAllowFileAccess(true);

        settings.setAllowContentAccess(true);

        settings.setMediaPlaybackRequiresUserGesture(false);

        webView.setWebViewClient(new WebViewClient() {

            @Override
            public boolean shouldOverrideUrlLoading(
                    WebView view,
                    WebResourceRequest request) {

                Uri uri = request.getUrl();

                String scheme = uri.getScheme();

                if ("http".equalsIgnoreCase(scheme)
                        || "https".equalsIgnoreCase(scheme)
                        || "mailto".equalsIgnoreCase(scheme)
                        || "tg".equalsIgnoreCase(scheme)) {

                    try {

                        Intent intent =
                                new Intent(
                                    Intent.ACTION_VIEW,
                                    uri
                                );

                        startActivity(intent);

                    } catch (Exception ignored) {
                    }

                    return true;
                }

                return false;
            }
        });

        webView.loadUrl(
            "file:///android_asset/index.html"
        );
    }

    @Override
    public void onBackPressed() {

        if (webView.canGoBack()) {

            webView.goBack();

        } else {

            super.onBackPressed();

        }
    }
}
EOF

      - name: Собрать Debug APK
        run: |

          gradle assembleDebug --no-daemon

      - name: Переименовать APK
        run: |

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "Salomat-${{ github.run_id }}.apk"

      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          gh release create \
            "salomat-build-${{ github.run_id }}" \
            "Salomat-${{ github.run_id }}.apk" \
            --title "Salomat APK #${{ github.run_number }}" \
            --notes "Debug APK автоматически собран через Salomat Company."
